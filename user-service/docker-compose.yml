services:
  db:
    image: postgres:14-alpine
    container_name: user_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users_database
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: user-service
    restart: always
    depends_on:
      - db
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: "postgres://postgres:password@db:5432/users_database"

volumes:
  pgdata: