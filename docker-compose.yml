services:
  kong:
    image: kong
    container_name: kong-gateway
    restart: unless-stopped
    environment:
      # Declarative mode configuration
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/etc/kong/kong.yml"
      
      # Network configuration
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      
      # Admin API configuration
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"
      
      # Proxy configuration
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      
      # Additional settings
      KONG_LOG_LEVEL: info
    ports:
      - "8000:8000"   # Proxy HTTP
      - "8443:8443"   # Proxy HTTPS
      - "8001:8001"   # Admin API
      - "8002:8002"   # Admin GUI
    volumes:
      - ./kong/config.yml:/etc/kong/kong.yml:ro
      - ./ssl:/etc/kong/ssl:ro  # Optional: for SSL certificates
    networks:
      - open-sage
    depends_on:
      postgres:
        condition: service_started
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: always
    depends_on:
      postgres:
        condition: service_started
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: "postgres://postgres:password@postgres:5432/users_service_db"
    networks:
      - open-sage



  postgres:
      image: postgres:14-alpine
      container_name: postgres
      restart: unless-stopped
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password
        POSTGRES_DB: users_service_db
      volumes:
        - db-data:/var/lib/postgresql/data
      ports:
        - "5432:5432"
      networks:
        - open-sage
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 10s
        timeout: 5s
        retries: 5



networks:
  open-sage:
    driver: bridge

volumes:
  kong-data:
  db-data: